  <text x="92" y="31" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9db0c8">evaltrim simulate-remove … privacy-delete</text>
  <text x="24" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"># Removal simulation: `privacy-delete`</text><text x="24" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">## BEFORE</text><text x="24" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Tests: 12</text><text x="24" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Behavior coverage: 100.0%</text><text x="24" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Critical coverage: 100.0%</text><text x="24" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">## AFTER removing `privacy-delete`</text><text x="24" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Tests: 11</text><text x="24" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Behavior coverage: 100.0% -&gt; 87.5%</text><text x="24" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Critical coverage: 100.0% -&gt; 80.0%</text><text x="24" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Verdict: **KEEP**</text><text x="24" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Reason: Removal reduces critical behavior coverage.</text><text x="24" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- Removal reduces critical behavior coverage.</text><text x="24" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- Lost critical behaviors: destructive_action</text><text x="24" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">Lost atoms:</text><text x="24" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `condition:destructive`</text><text x="24" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `domain:privacy`</text><text x="24" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `state:unauthenticated`</text>
</svg>
