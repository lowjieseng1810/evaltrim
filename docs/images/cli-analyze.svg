s_request, condition:conflicting_instruction</text><text x="24" y="578" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `privacy-delete`: condition:destructive, domain:privacy, state:unauthenticated</text><text x="24" y="596" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `auth-reset`: condition:unauthenticated, domain:authentication</text><text x="24" y="614" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `policy-abuse`: condition:policy_violation</text><text x="24" y="632" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">## Critical Behaviors</text><text x="24" y="668" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="686" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `payment`: covered</text><text x="24" y="704" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `destructive_action`: covered</text><text x="24" y="722" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `privacy`: covered</text><text x="24" y="740" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `policy_violation`: covered</text><text x="24" y="758" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">- `authentication`: covered</text><text x="24" y="776" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="794" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e7ecf3">## Coverage Risks</text><text x="24" y="812" font-family="ui-monospace, S