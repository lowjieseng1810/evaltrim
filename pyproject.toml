[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaltrim"
version = "1.0.0"
description = "The evaluation control plane for AI agents. Unique witnesses, counterfactual removal, evidence-backed suite maintenance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "EvalTrim contributors" }]
keywords = ["eval", "agent", "testing", "coverage", "redundancy", "cli", "llm", "evaluation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
]

[project.scripts]
evaltrim = "evaltrim.cli:app"

[project.urls]
Homepage = "https://github.com/lowjieseng1810/evaltrim"
Documentation = "https://github.com/lowjieseng1810/evaltrim/tree/main/docs"
Repository = "https://github.com/lowjieseng1810/evaltrim"

[tool.hatch.build.targets.wheel]
packages = ["src/evaltrim"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
python_classes = ["Describe*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"src/evaltrim/competitive.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
packages = ["evaltrim"]
mypy_path = "src"
